name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Set up MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: moon version --all
      - run: moon update
      - name: Fetch GPT-2 tokenizer
        shell: bash
        run: ./scripts/fetch-gpt2.sh
      - run: moon check --deny-warn
      - run: moon test --deny-warn
      - name: Verify formatting
        shell: bash
        run: |
          moon fmt
          git diff --exit-code
      - name: Verify public interface files
        shell: bash
        run: |
          moon info
          git diff --exit-code

  native-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Fetch GPT-2 tokenizer
        shell: bash
        run: ./scripts/fetch-gpt2.sh
      - run: moon test --target native --deny-warn
      - name: Monkey typewriter experiment
        if: hashFiles('mask/moon.pkg') != ''
        run: >
          moon run cmd/main --target native --
          assets/gpt2/tokenizer.json
          examples/schemas/user.json
          examples/schemas/order.json
          examples/schemas/tool_call.json
